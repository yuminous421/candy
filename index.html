    <style>
        html { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
        body {
            background-color: #EFE3C8;
            background-image: radial-gradient(#D6BF95 0.85px, transparent 0.85px);
            background-size: 15px 15px;
        }
        .paper-bg { background-color: transparent; }
        .font-display { font-family: 'Noto Serif TC', 'Songti TC', serif; }
        ::selection { background: #F0B429; color: #1A1108; }

        .scrollbar-thin::-webkit-scrollbar { width: 6px; }
        .scrollbar-thin::-webkit-scrollbar-track { background: #EFE3C8; }
        .scrollbar-thin::-webkit-scrollbar-thumb { background: #C9B183; border-radius: 3px; }
        .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #A98D63; }
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.5s ease-out forwards; }

        /* 標記名稱預設隱藏，僅顯示目前點選的糖廠，避免地圖過於雜亂 */
        .factory-label { opacity: 0; visibility: hidden; }
        .factory-label.is-selected { opacity: 1; visibility: visible; }

        /* 縣市邊界地圖樣式：復古糖廠印刷風（墨黑海域＋奶油紙陸地＋粗黑線） */
        #taiwan-map {
            display: block;
            box-sizing: border-box;
            border: 2px solid #1A1108;
            border-radius: 4px;
            box-shadow: 8px 8px 0 #1A1108;
            background: #231B10;
        }

        <section id="rail-wufeng" class="border-y-2 border-[#1A1108] bg-[#F7ECD4]">
            <div class="max-w-6xl mx-auto px-4 md:px-6 py-12 md:py-20">
                <div class="max-w-3xl reveal">
                    <p class="text-[11px] font-black tracking-[0.3em] text-[#B8420A]">04 / WHY "FIVE-POINTS"?</p>
                    <h2 class="font-display text-3xl md:text-4xl font-black mt-2">為什麼叫「五分車」？</h2>
                    <p class="text-sm leading-7 text-[#3B2B17] mt-3">
                        同一個暱稱，至少有三種解釋；而最早的文字線索，可能比多數說法都更早。
                        先說結論：它不是精確的規格換算，而是民間對一條「比官鐵小一號」的鐵路的直覺命名。
                    </p>
                </div>

                <div class="grid md:grid-cols-2 gap-4 md:gap-5 mt-8">
                    <article class="reveal card p-5 md:p-6 border-l-8 border-l-[#E86A17]">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 bg-[#E86A17] border-2 border-[#1A1108] flex items-center justify-center text-[11px] font-black">A</span>
                            <h3 class="font-display text-lg md:text-xl font-black">軌距一半說</h3>
                        </div>
                        <p class="text-xs md:text-[13px] leading-6 text-[#2B1D0E] mt-3">
                            糖鐵軌距 762 公釐，約為標準軌 1,435 公釐的一半，所以叫「五分」。
                        </p>
                        <p class="text-[11px] md:text-xs leading-5 text-[#6B5330] mt-3 pt-3 border-t border-dashed border-[#C9B183]">
                            <span class="font-black text-[#8E2B1B]">問題在於：</span>
                            762 源自英國的二英尺六英寸，兩倍是 1,524 公釐的俄羅斯寬軌，並非標準軌的一半；
                            而且臺灣第一條標準軌鐵路是 1997 年的臺北捷運淡水線，在此之前很難用比較得出「五分」。
                        </p>
                    </article>

                    <article class="reveal card p-5 md:p-6 border-l-8 border-l-[#0B5D5D]">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 bg-[#0B5D5D] text-[#FBF4E1] border-2 border-[#1A1108] flex items-center justify-center text-[11px] font-black">B</span>
                            <h3 class="font-display text-lg md:text-xl font-black">七分・十分對照說</h3>
                        </div>
                        <p class="text-xs md:text-[13px] leading-6 text-[#2B1D0E] mt-3">
                            有人把 1,067 公釐的臺鐵稱作「七分車」、標準軌的高鐵稱作「十分車」，再回推糖鐵是「五分車」。
                        </p>
                        <p class="text-[11px] md:text-xs leading-5 text-[#6B5330] mt-3 pt-3 border-t border-dashed border-[#C9B183]">
                            <span class="font-black text-[#8E2B1B]">問題在於：</span>
                            「五分車」在 1913 年已是一般用語，遠早於高鐵出現；用後來的車種比例回推命名，時間順序並不成立。
                        </p>
                    </article>

                    <article class="reveal card p-5 md:p-6 border-l-8 border-l-[#8E2B1B]">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 bg-[#8E2B1B] text-[#FBF4E1] border-2 border-[#1A1108] flex items-center justify-center text-[11px] font-black">C</span>
                            <h3 class="font-display text-lg md:text-xl font-black">「五分仔力」說</h3>
                        </div>
                        <p class="text-xs md:text-[13px] leading-6 text-[#2B1D0E] mt-3">
                            糖鐵前輩口述：柴油動力化初期，糖鐵車速大約三、四十公里，約為臺鐵七、八十公里的一半，
                            因此稱為「五分仔力」。
                        </p>
                        <p class="text-[11px] md:text-xs leading-5 text-[#6B5330] mt-3 pt-3 border-t border-dashed border-[#C9B183]">
                            <span class="font-black text-[#0B5D5D]">另一種角度：</span>
                            這個說法把「五分」理解為速度，而不是軌距，也最貼近第一線人員的實際感受。
                        </p>
                    </article>

                    <article class="reveal card p-5 md:p-6 border-l-8 border-l-[#F0B429]">
                        <div class="flex items-center gap-2">
                            <span class="w-6 h-6 bg-[#F0B429] border-2 border-[#1A1108] flex items-center justify-center text-[11px] font-black">D</span>
                            <h3 class="font-display text-lg md:text-xl font-black">民間經驗說</h3>
                        </div>
                        <p class="text-xs md:text-[13px] leading-6 text-[#2B1D0E] mt-3">
                            黃智偉〈五分車一世紀〉指出，「五分車」在 1913 年便已被當成一般用語。
                            民眾看到糖鐵的軌距比官鐵小、車輛也比官鐵小，便直覺地這樣稱呼。
                        </p>
                        <p class="text-[11px] md:text-xs leading-5 text-[#6B5330] mt-3 pt-3 border-t border-dashed border-[#C9B183]">
                            <span class="font-black text-[#0B5D5D]">重點是：</span>
                            名稱出自民間經驗，不是專家的測量換算。這也解釋了為什麼各種「比例說」都對不齊。
                        </p>
                    </article>
                </div>

                <div class="reveal mt-6 bg-[#1A1108] text-[#FBF4E1] border-2 border-[#1A1108] shadow-[6px_6px_0_#E86A17] p-5 md:p-6 flex flex-col md:flex-row md:items-center gap-4">
                    <span class="shrink-0 font-display text-4xl md:text-5xl font-black text-[#F0B429] leading-none">「</span>
                    <p class="font-display text-base md:text-xl font-black leading-relaxed">
                        五分車是暱稱，不是規格。它記錄的是人們怎麼看這條鐵路，而不是軌距怎麼換算。
                    </p>

                                    {bullet('莖由節與節間及纖維化外皮組成；節有生長點可長側芽，田間種植多去除側芽以減少養分散。')}
                                    {bullet('種植分秋植、春植與宿根三種，至少須經一年至一年半的生長期才能採收。')}
                                    {bullet('糖用甘蔗多在十一月下旬少雨期採收：莖內水分減少、蔗糖濃度升高，可減少製糖成本。')}
                                    {bullet('糖用甘蔗以臺蔗十號（ROC10）改良而成的臺蔗十六號（ROC16）為主要栽培種。')}
                                    {bullet('近年以莖頂分生組織進行組織培養，分離出無病毒的健康甘蔗種苗。')}
                                </ul>
                            </ProcCard>
                            <ProcCard title="蔗渣的舊日價值" tone="#1A1108">
                                <p className="text-[11px] md:text-xs leading-relaxed text-[#3B2B17]">在塑膠製品尚未量產以前，糖用甘蔗製糖剩下的蔗渣纖維是製造隔熱蔗板和造紙的主要原料，具有多方面的經濟價值；如今這些用途多已被低成本原料取代。</p>
                                <p className="mt-3 border-t-2 border-[#1A1108]/15 pt-3 text-[11px] md:text-xs leading-relaxed text-[#6B5330]">葉子是甘蔗植株面積佔比最高的部分；研究發現甘蔗光合作用的效率相當高，甚至比熱帶雨林的平均光合作用能力還要高，對空氣淨化貢獻良多。</p>
                            </ProcCard>
                        </div>
                    </ProcSection>

                    <ProcSection id="process-flow" num="06" title="兩條製糖路線" accent="#E86A17" subtitle="台糖以機械化與精密儀器進行精製；民間依賴經驗，只能做到粗製糖析出。">
                        <div className="grid gap-5 lg:grid-cols-2">
                            <ProcFlow title="台糖 · 機械化製糖" tone="#E86A17" steps={machineFlow} note="整個流程都以機械化完成；在精密儀器控制下，10 公斤甘蔗約可產製 1 公斤砂糖。" />
                            <ProcFlow title="民間 · 古法炒糖" tone="#8E2B1B" steps={folkFlow} note="傳統民間製糖沒有精密儀器，只能依賴經驗人工製作，只能達到粗製糖析出，無法達到精製糖的結晶。" />
                        </div>
                    </ProcSection>

                    <ProcSection id="process-chem" num="07" title="清淨、脫色與結晶的化學" accent="#0B5D5D" subtitle="去掉雜質、讓糖晶長到合乎商業標準，是製糖最關鍵的一段。">
                        <div className="grid gap-4 md:grid-cols-3">
                            <ProcCard title="石灰法 · 中和" tone="#8E2B1B">
                                <p className="text-[11px] md:text-xs leading-relaxed text-[#3B2B17]">甘蔗原汁為酸性，先加入鹼性的石灰進行酸鹼中和，然後煮沸放入沉澱槽靜置，讓懸浮的不純物質沉澱至液體底部。</p>
                            </ProcCard>
                            <ProcCard title="碳酸法 · 吸附" tone="#0B5D5D">
                                <p className="text-[11px] md:text-xs leading-relaxed text-[#3B2B17]">導入二氧化碳直到飽和，產生大量溶解度甚差的碳酸鈣粒子；這些粒子恰好吸附膠體、色素及其他非糖顆粒而沉澱，降低結晶蔗糖的顏色、提高清汁純度。</p>
                            </ProcCard>
                            <ProcCard title="亞硫酸法 · 脫色" tone="#B8420A">
                                <p className="text-[11px] md:text-xs leading-relaxed text-[#3B2B17]">沉澱後的蔗汁導入二氧化硫氣體進行脫色、形成硫酸鹽，讓蔗汁的顏色變淺。</p>
                            </ProcCard>
                        </div>
                        <div className="mt-4 grid gap-4 md:grid-cols-2">
                            <ProcCard title="從蔗汁到糖晶" tone="#1A1108">
                                <ul className="space-y-1.5 text-[11px] md:text-xs leading-relaxed text-[#3B2B17]">
                                    {bullet('淨化與脫色後的蔗汁送至蒸發罐，利用真空減壓加速蒸發來濃縮蔗汁。')}
                                    {bullet('再送入結晶罐煮糖，讓水分持續蒸發、結晶析出，並抽驗檢視養晶情形。')}
                                    {bullet('晶體與濃縮蔗汁混合後，以離心方式分蜜，將蔗糖晶體分離出來。')}
                                    {bullet('不符商業標準者重新溶解，或充當糖種讓蔗糖析出，重複結晶與分蜜到合乎大小為止。')}
                                    {bullet('剛收集的晶體含表面附著水、葡萄糖結合水與顆粒間游離水，必須乾燥才不會潮解。')}
                                </ul>
                            </ProcCard>
                            <ProcCard title="方法決定糖色" tone="#1A1108">
                                <div className="space-y-2 text-[11px] md:text-xs leading-relaxed text-[#3B2B17]">
                                    <p><span className="font-black text-[#E86A17]">碳酸法 →</span> 台糖特砂（俗稱白糖）。</p>
                                    <p><span className="font-black text-[#8E2B1B]">石灰法 →</span> 台糖二砂（俗稱紅糖）。</p>
                                    <p>這兩種糖還可送到精煉糖廠再純化，形成<span className="font-black text-[#1A1108]">精煉特砂、精煉細砂及二砂</span>。</p>
                                </div>
                                <p className="mt-3 border-t-2 border-[#1A1108]/15 pt-3 text-[11px] leading-relaxed text-[#6B5330]">在不同的製造階段，可得到顏色、顆粒大小與純度不同的糖顆粒。</p>
                            </ProcCard>
                        </div>
                    </ProcSection>

                    <ProcSection id="process-sugar" num="08" title="糖的種類與保存" accent="#8E2B1B" subtitle="不同的製法，留下不同的顏色、晶粒與風味。">
                        <div className="grid gap-4 md:grid-cols-3">
                            <ProcCard title="特砂 · 白糖" tone="#E86A17">
                                <p className="text-[11px] md:text-xs leading-relaxed text-[#3B2B17]">台糖特砂即學術上的「蔗精」，一般市面販售的白糖就是它。碳酸法製成，晶粒小、純度高，可以再精煉成精煉特砂與精煉細砂。</p>
                            </ProcCard>
                            <ProcCard title="二砂・黑糖 · 含蜜糖" tone="#8E2B1B">
                                <p className="text-[11px] md:text-xs leading-relaxed text-[#3B2B17]">粗製黑糖俗稱紅糖，除了糖類與氨基酸，還含鈣、磷、鐵、鉀、鈉，以及維生素 B1、B2、菸鹼酸與助消化的蔗糖酵素。糖蜜與結晶未經離心分離，甘蔗汁中的雜質、氣味、營養成分都保留在糖中。</p>
                            </ProcCard>
                            <ProcCard title="冰糖 · 慢結晶" tone="#0B5D5D">
                                <p className="text-[11px] md:text-xs leading-relaxed text-[#3B2B17]">古代沒有現代化設備，冰糖是當時能得到最純的結晶糖。以高濃度蔗糖溶液長時間靜置蒸發自然結晶，並用棉線懸空、下端浸入飽和糖水「養糖」讓晶體長大；晶粒更大、純度幾乎與砂糖相同，最大差異在晶粒大小。</p>
                            </ProcCard>
                        </div>
                        <div className="mt-4 grid gap-4 md:grid-cols-2">
                            <ProcCard title="民間炒糖的關鍵" tone="#1A1108">
                                <p className="text-[11px] md:text-xs leading-relaxed text-[#3B2B17]">蔗汁在大鍋中煮沸，浮沫夾雜質由濾網撈除；持續加熱無法像台糖控制在恆溫，濃縮蔗汁會轉成糖膏而非蔗糖晶體。加熱過快會產生大量焦糖或碳化，使品質下降；以鍋鏟翻轉測試黏稠度，合乎要求立即熄火，移至炒糖架不斷翻動降溫，期間可拌入調味料，快凝固時倒入模型中切塊。</p>
                            </ProcCard>
                            <ProcCard title="吃得甜，也要吃得剛好" tone="#1A1108">
                                <p className="text-[11px] md:text-xs leading-relaxed text-[#3B2B17]">蔗糖除了是居家常用的調味品，也是中醫重要的藥材，被認為有補血、益氣、促進血液循環、活血舒筋、健脾胃等功用，屬於味甘溫和的良藥。不過過量甜食容易造成肥胖，攝取過多熱量也會使正餐食慾不振，導致營養不均、影響生長發育。</p>
                            </ProcCard>
                        </div>
                    </ProcSection>

                    <ProcSection id="process-cycle" num="09" title="蔗渣與生質能：讓廢料回到能源" accent="#B8420A" subtitle="現今環保意識抬頭，製糖過程也盡量減少廢棄物，讓資源重複利用。">
                        <div className="bg-[#FBF4E1] border-2 border-[#1A1108] rounded-sm shadow-[6px_6px_0_#1A1108] p-3 md:p-5">
                            <svg viewBox="0 0 900 240" className="w-full h-auto" role="img" aria-label="蔗渣燃燒發電、蒸氣回用與廢料堆肥的循環示意圖">

                                    <rect x="18" y="24" width="170" height="76" rx="8" />
                                    <rect x="486" y="24" width="170" height="76" rx="8" />
                                </g>
                                <g fill="#E86A17" stroke="#1A1108" strokeWidth="3">
                                    <rect x="252" y="24" width="170" height="76" rx="8" />
                                    <rect x="720" y="24" width="162" height="76" rx="8" />
                                </g>
                                <g fill="#FBF4E1" stroke="#1A1108" strokeWidth="3">
                                    <rect x="252" y="154" width="270" height="70" rx="8" />
                                    <rect x="582" y="154" width="300" height="70" rx="8" />
                                </g>
                                <g fontFamily="'Noto Serif TC', serif" fontWeight="900" fontSize="19" fill="#1A1108" textAnchor="middle">
                                    <text x="103" y="70">蔗渣</text><text x="337" y="70">鍋爐燃燒</text><text x="571" y="70">高壓蒸氣</text><text x="801" y="70">發電機</text>
                                </g>
                                <g fontFamily="'Noto Serif TC', serif" fontWeight="900" fontSize="16" fill="#1A1108" textAnchor="middle">
                                    <text x="387" y="196">降溫蒸氣 → 清淨・濃縮・結晶</text>
                                    <text x="732" y="196">過濾廢料 → 肥料・堆肥</text>
                                </g>
                                <g fill="none" stroke="#1A1108" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round">
                                    <path d="M192 62 H244 M234 54 L246 62 L234 70" />
                                    <path d="M426 62 H478 M468 54 L480 62 L468 70" />
                                    <path d="M660 62 H712 M702 54 L714 62 L702 70" />
                                </g>
                                <path d="M801 104 C 852 148 782 190 526 190 M542 182 L524 190 L542 198" fill="none" stroke="#B8420A" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
                                <text x="690" y="142" fontFamily="'Noto Serif TC', serif" fontWeight="900" fontSize="13" fill="#B8420A">能源回用</text>
                            </svg>
                        </div>
                        <div className="mt-4 grid gap-4 md:grid-cols-3">
                            <ProcCard title="蔗渣發電" tone="#B8420A">
                                <p className="text-[11px] md:text-xs leading-relaxed text-[#3B2B17]">台糖製糖機械首需動力，先把去年保留的部分蔗渣充當鍋爐燃料，產生大量高壓蒸氣推動發電機；搾汁產生的新鮮蔗渣繼續充當燃料，持續發電。</p>
                            </ProcCard>
                            <ProcCard title="蒸氣與肥料回用" tone="#0B5D5D">
                                <p className="text-[11px] md:text-xs leading-relaxed text-[#3B2B17]">發電後已降溫的蒸氣，再做為製糖時清淨、濃縮及結晶所需要的能源；過濾及清淨階段產生的廢料充當發酵肥料，民間製糖的廢棄物則直接送至田園做堆肥。</p>
                            </ProcCard>
                            <ProcCard title="下一里程：生質能" tone="#8E2B1B">
                                <p className="text-[11px] md:text-xs leading-relaxed text-[#3B2B17]">化石能源逐漸短缺，燃燒又造成空氣污染。巴西很早就發展以甘蔗汁利用酵母菌發酵生產酒精，加入汽油使用，可減少汽油消耗、增加燃燒效率；高效率的光合作用也有助提升空氣品質。</p>
                            </ProcCard>
                        </div>
                    </ProcSection>

                    <ProcSection id="process-transfer" num="10" title="上車，去看還在製糖的廠" accent="#0B5D5D" subtitle="從甘蔗到糖的旅程還沒結束。搭上現役列車，直接轉往「糖廠現況」裡仍在運作的廠區。">
                        <div className="bg-[#FBF4E1] border-2 border-[#1A1108] rounded-sm shadow-[6px_6px_0_#1A1108] p-4 md:p-5">
                            <div className="flex flex-wrap items-center justify-between gap-3">
                                <p className="flex items-center gap-2 text-[10px] md:text-xs font-black tracking-[0.16em] text-[#0B5D5D]">
                                    <TrainFront className="w-4 h-4 shrink-0" />
                                    現役製糖列車 · {runningFactories.length} 站
                                </p>
                                <button
                                    type="button"
                                    onClick={boardTrain}
                                    className="border-2 border-[#1A1108] bg-[#0B5D5D] px-3 py-1.5 text-[11px] font-black text-[#FBF4E1] shadow-[3px_3px_0_#1A1108] transition-transform hover:-translate-y-0.5"
                                >
                                    直接前往糖廠現況 →
                                </button>
                            </div>

                            <div className="mt-4 flex gap-3 overflow-x-auto scrollbar-thin pb-2">
                                <div className="shrink-0 w-[132px] flex flex-col items-center justify-end text-center">
                                    <svg viewBox="0 0 130 88" className="w-[124px] h-auto" role="img" aria-label="五分車火車頭手繪圖">
                                        <path d="M92 36 V16 H106 V36" fill="#0B5D5D" stroke="#1A1108" strokeWidth="3" strokeLinejoin="round" />
                                        <rect x="12" y="36" width="90" height="32" rx="6" fill="#0B5D5D" stroke="#1A1108" strokeWidth="3" />
                                        <rect x="20" y="44" width="24" height="15" rx="2" fill="#F0B429" stroke="#1A1108" strokeWidth="2.5" />
                                        <rect x="52" y="44" width="24" height="15" rx="2" fill="#F0B429" stroke="#1A1108" strokeWidth="2.5" />
                                        <path d="M102 52 H120" stroke="#1A1108" strokeWidth="3" strokeLinecap="round" />
                                        <path d="M12 72 H112" stroke="#1A1108" strokeWidth="3" strokeLinecap="round" />
                                        <g fill="#FBF4E1" stroke="#1A1108" strokeWidth="3">
                                            <circle cx="34" cy="76" r="8" /><circle cx="62" cy="76" r="8" /><circle cx="90" cy="76" r="8" />
                                        </g>
                                    </svg>
                                    <p className="mt-1 text-[10px] font-black text-[#1A1108]">現役列車</p>
                                </div>

                                {runningFactories.map((factory, i) => (
                                    <button
                                        key={factory.id}
                                        type="button"
                                        onClick={() => onOpenTab && onOpenTab('data', factory.id)}
                                        className="group flex w-[214px] shrink-0 flex-col border-2 border-[#1A1108] bg-[#F2E5C8] rounded-t-2xl shadow-[4px_4px_0_#1A1108] transition-transform hover:-translate-y-1"
                                    >
                                        <div className="h-3 rounded-t-2xl border-b-2 border-[#1A1108] bg-[#1A1108]" />
                                        <div className="flex-grow px-3 pt-3 pb-2">
                                            <div className="flex items-center justify-between gap-1">
                                                <span className="text-[10px] font-black text-[#B8420A]">第 {i + 1} 站</span>
                                                <span className="shrink-0 border border-[#1A1108] bg-[#FBF4E1] px-1.5 py-0.5 text-[9px] font-black text-[#1A1108]">{factory.categoryLabel}</span>
                                            </div>
                                            <p className="mt-2 font-display text-sm font-black leading-snug text-[#1A1108]">{factory.name}</p>
                                            <p className="mt-1.5 text-[10px] leading-relaxed text-[#6B5330]">{factory.location}</p>
                                            <p className="mt-2 text-[11px] font-black text-[#0B5D5D] group-hover:text-[#E86A17]">上車 → 糖廠現況</p>
                                        </div>
                                        <div className="flex justify-between px-5 pb-2">
                                            <span className="h-4 w-4 rounded-full border-2 border-[#1A1108] bg-[#F0B429]" />
                                            <span className="h-4 w-4 rounded-full border-2 border-[#1A1108] bg-[#F0B429]" />
                                        </div>
                                    </button>
                                ))}
                            </div>

                            <div className="track-band mt-4" />
                            <p className="mt-3 text-[10px] md:text-[11px] leading-relaxed text-[#6B5330]">點選任一車廂，即切換至「糖廠現況」並帶入該廠資料；四站皆為目前仍運作的糖廠／工場。</p>
                        </div>
                    </ProcSection>

                </div>
            );
        };

        const RailTab = () => {
            const hostRef = React.useRef(null);

            React.useEffect(() => {
                const host = hostRef.current;
                if (!host) return undefined;

                const SVG_NS = 'http://www.w3.org/2000/svg';
                const branchLayer = host.querySelector('#rail-branches');
                const nodeLayer = host.querySelector('#rail-nodes');
                const svg = host.querySelector('#rail-map');
                if (!branchLayer || !nodeLayer || !svg) return undefined;

                const make = (tag, attrs) => {
                    const el = document.createElementNS(SVG_NS, tag);
                    Object.entries(attrs || {}).forEach(([key, value]) => el.setAttribute(key, value));
                    return el;
                };

                const accent = host.querySelector('#rail-accent');
                const countyEl = host.querySelector('#rail-county');
                const statusEl = host.querySelector('#rail-status');
                const nameEl = host.querySelector('#rail-name');
                const lineEl = host.querySelector('#rail-line');
                const descEl = host.querySelector('#rail-desc');
                const factsEl = host.querySelector('#rail-facts');
                const noteEl = host.querySelector('#rail-note');

                const selectNode = (id) => {
                    const nd = RAIL_NODES.find((item) => item.id === id);
                    if (!nd || !nameEl) return;

                    nodeLayer.querySelectorAll('.node').forEach((g) => {
                        g.classList.toggle('is-active', g.dataset.id === id);
                    });

                    accent.style.background = nd.color;
                    countyEl.textContent = nd.county;
                    countyEl.style.background = nd.color;
                    countyEl.style.color = nd.color === '#E86A17' ? '#1A1108' : '#FBF4E1';

                    statusEl.textContent = nd.statusLabel;
                    statusEl.style.background = STATUS_STYLE[nd.status].bg;
                    statusEl.style.color = STATUS_STYLE[nd.status].fg;

                    nameEl.textContent = nd.name;
                    lineEl.textContent = nd.line;
                    descEl.textContent = nd.desc;
                    noteEl.textContent = nd.note;

                    factsEl.innerHTML = nd.facts.map(([label, value]) => `
                        <div class="bg-[#FFFBF0] border border-[#C9B183] border-l-4 border-l-[#1A1108] px-2.5 py-2">
                            <p class="text-[10px] font-bold text-[#6B5330] leading-tight">${label}</p>
                            <p class="text-[11px] font-black text-[#1A1108] mt-0.5 leading-snug">${value}</p>
                        </div>
                    `).join('');
                };

                // 分支線：示意各路線由縱貫線旁的糖廠節點分出
                RAIL_NODES.forEach((nd) => {
                    const d = nd.side === 'left'
                        ? `M450 ${nd.y} C 412 ${nd.y - 18}, 348 ${nd.y - 18}, ${nd.x} ${nd.y}`
                        : `M450 ${nd.y} C 488 ${nd.y - 18}, 552 ${nd.y - 18}, ${nd.x} ${nd.y}`;
                    branchLayer.appendChild(make('path', {
                        d: d,
                        class: 'branch' + (nd.status === 'freight' ? ' branch-freight' : ''),
                        stroke: nd.color
                    }));
                });

                RAIL_NODES.forEach((nd) => {
                    const g = make('g', {
                        class: 'node',
                        'data-id': nd.id,
                        tabindex: '0',
                        role: 'button',
                        'aria-label': `${nd.name}，${nd.statusLabel}`
                    });

                    entries.forEach((entry) => {
                        if (entry.isIntersecting) {

                            io.unobserve(entry.target);
                        }

                    });

                                            <ExternalLink className="w-3.5 h-3.5" />
                                            在 Google 地圖開啟
                                        </a>

                                        <div className="mt-4 bg-[#F2E5C8] p-3.5 rounded-md border-2 border-[#1A1108]">
                                            <div className="flex items-center justify-between gap-2">
                                                <p className="text-xs font-black text-[#1A1108]">在地資訊</p>
                                                <span className="text-[10px] font-bold text-[#6B5330]">
                                                    {nearbyArea ? `${nearbyArea} · ` : ''}{modeLabel}
                                                </span>
                                            </div>

                                            {mapMode === 'factory' ? (
                                                <div className="mt-2 rounded-sm bg-[#FFFBF0] border-2 border-[#1A1108] px-3.5 py-3">
                                                    <p className="text-[9px] font-black tracking-[0.2em] text-[#B8420A]">位置</p>
                                                    <p className="mt-1 text-sm font-black leading-snug text-[#1A1108]">{selectedFactory.mapName || selectedFactory.name}</p>
                                                    <p className="mt-1 text-[11px] leading-relaxed text-[#3B2B17]">{selectedFactory.location}</p>
                                                    <p className="mt-2 border-t border-[#1A1108]/15 pt-2 text-[10px] leading-relaxed text-[#6B5330]">
                                                        想看周邊介紹，切換上方「周邊美食」或「周邊景點」；交通方式請切換「交通」。
                                                    </p>
                                                </div>
                                            ) : mapMode === 'transport' ? (
                                                <div className="mt-2 space-y-1.5">
                                                    {transport.map(([way, note]) => (
                                                        <div key={way} className="rounded-sm bg-[#FFFBF0] border-2 border-[#1A1108] px-3.5 py-2.5">
                                                            <div className="flex items-baseline gap-2">
                                                                <span className="shrink-0 border border-[#1A1108]/30 bg-[#F2E5C8] px-1.5 py-0.5 text-[9px] font-black tracking-[0.08em] text-[#3B2B17]">{way}</span>
                                                                <p className="text-[11px] leading-relaxed text-[#3B2B17]">{note}</p>
                                                            </div>
                                                        </div>
                                                    ))}
                                                    <p className="!mt-2 text-[10px] leading-relaxed text-[#6B5330]">站距為直線距離估算，實際路線、班次與車資請以現場為準。</p>
                                                </div>
                                            ) : (
                                                <div className="mt-3">
                                                    <div className="flex items-baseline justify-between gap-2">
                                                        <p className="flex items-center gap-1.5 text-xs font-black tracking-[0.16em]" style={{ color: NEARBY_META[mapMode].tone }}>
                                                            {React.createElement(NEARBY_META[mapMode].Icon, { className: 'w-4 h-4' })}
                                                            {NEARBY_META[mapMode].label}
                                                        </p>
                                                        <span className="text-[9px] font-black tracking-[0.18em] text-[#6B5330]">{(nearby[mapMode] || []).length} 處</span>
                                                    </div>
                                                    <div className="mt-2 space-y-1.5">
                                                        {(nearby[mapMode] || []).map(([name, type, note], index) => (
                                                            <div key={name} className="rounded-sm bg-[#FFFBF0] border-2 border-[#1A1108] px-3.5 py-2.5">
                                                                <div className="flex items-baseline gap-1.5">
                                                                    <span className="text-[10px] font-black tabular-nums text-[#B8420A]">{String(index + 1).padStart(2, '0')}</span>
                                                                    <p className="text-sm font-black leading-tight text-[#1A1108]">{name}</p>
                                                                    <span className="ml-auto shrink-0 border border-[#1A1108]/30 bg-[#F2E5C8] px-1.5 py-0.5 text-[9px] font-black tracking-[0.08em] text-[#3B2B17]">{type}</span>
                                                                </div>
                                                                <p className="mt-1 text-[11px] leading-relaxed text-[#6B5330]">{note}</p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <p className="text-[10px] md:text-[11px] text-[#6B5330] mt-3 leading-relaxed">
                                            切換上方分類，下方會跟著換成位置、美食、景點或交通方式；地圖搜尋同步更新，周邊介紹為編採整理，實際營業與班次請以現場為準。
                                        </p>
                                    </div>
                                )}
                            </div>

                        </div>
                        </>
                        )}
                    </main>

                    {/* 頁尾 */}
                    <footer className="bg-[#1A1108] text-[#E9D9B8] py-6 mt-12 text-center border-t-4 border-[#E86A17] text-xs md:text-sm">
                        <p>© {new Date().getFullYear()} 製糖中 · 一座島嶼的甜味版圖</p>
                        <p className="text-[#A98D63] mt-1">地圖圖資版權依據 Simplemaps 授權條款使用 · Google 地圖為 Google LLC 提供之服務</p>
                        <button
                            type="button"
                            onClick={() => setSplashOpen(true)}
                            className="mt-3 inline-flex items-center gap-1.5 border-2 border-[#E9D9B8] px-2.5 py-1 text-[10px] font-black tracking-[0.18em] text-[#F0B429] transition-colors hover:bg-[#E86A17] hover:text-[#1A1108] md:text-xs"
                        >
                            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg>
                            重播開場動畫
                        </button>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SugarMapApp />);
    </script>
</body>
</html>
